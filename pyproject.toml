[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-daily"
version = "0.1.0"
description = "Recognition-driven automation for predefined daily workflows"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "numpy>=1.24", "opencv-python>=4.8"]

[project.optional-dependencies]
desktop = ["mss>=9", "PyAutoGUI>=0.9.54; sys_platform == 'win32'"]
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=8"]

[project.scripts]
jev = "jev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
